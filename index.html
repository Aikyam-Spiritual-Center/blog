  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevents bounce and scrollbars on mobile */
    }

    body {
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height for mobile browsers */
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      background-color: #0b0b0b; /* Fallback dark background */
      background-image: url('https://aikyam-spiritual-center.github.io/blog/aikyam-logo.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: min(85vw, 85vh); /* Keeps logo fully contained and proportional */
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    /* Subtle overlay to ensure text/spinner remain legible against the logo */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .content-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 480px;
    }

    /* Responsive Spinner */
    .spinner {
      width: clamp(48px, 12vw, 72px);
      height: clamp(48px, 12vw, 72px);
      border: 5px solid rgba(255, 255, 255, 0.25);
      border-top: 5px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      margin-bottom: clamp(14px, 3vh, 24px);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Fluid typography that scales smoothly between mobile and desktop */
    .loading-text {
      font-size: clamp(1rem, 4.5vw, 1.5rem);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.4;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div class="content-container">
    <div class="spinner" role="status" aria-label="Loading"></div>
    <div class="loading-text">Loading, please wait...</div>
  </div>
</body>
